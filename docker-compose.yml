services:

  postgres:
    image: postgres:17
    container_name: maos-amigas-postgres

    environment:
      POSTGRES_DB: MaosAmigas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - maos_amigas_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d MaosAmigas"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: maos-amigas-api

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/MaosAmigas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      GROQ_API_KEY: ${GROQ_API_KEY}

      CLIENT_ID: myclientid
      CLIENT_SECRET: myclientsecret
      JWT_DURATION: 86400
      SECURITY_JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      SECURITY_JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem

      CORS_ORIGINS: http://localhost:3000,http://localhost:5173

    volumes:
      - ./.secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ./.secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

  agno-service:
    build:
      context: ./agno-service
    container_name: maos-amigas-agno
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      SPRING_API_HOST: app
      SPRING_API_PORT: 8080
      AGNO_CORS_ORIGINS: ${AGNO_CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  maos_amigas_postgres_data:
